name: Verify Wakeflow

on:
  pull_request:
  push:
    branches: [main]
    # A v* tag runs only the release job below: its commit already ran the gate when main was pushed.
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wakeflow-verify-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request runs are cancelled; every push to main keeps its own complete record.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: ${{ matrix.profile }} / ${{ matrix.os }}
    if: github.ref_type != 'tag'
    runs-on: ${{ matrix.os }}
    # The gate profile runs the whole `npm test` under a 90-minute verifier budget at two workers.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        profile: [gate, artifact]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - name: Run the existing verification profile
        env:
          WAKEFLOW_PROFILE: ${{ matrix.profile }}
          WAKEFLOW_TEST_CONCURRENCY: "2"
          # 轮换的模型种子（open-items 批次 5）：每次运行一个新种子，种子进公共报告的 modelTests；反例落盘随制品上传。
          WAKEFLOW_MODEL_SEED: ${{ github.run_number }}
        run: |
          mkdir -p .build/ci-private
          npm run --silent wf -- verify "$WAKEFLOW_PROFILE" > .build/ci-private/summary.json
      - name: Export bounded public fields
        if: always()
        run: npm run --silent wf -- ci export --summary .build/ci-private/summary.json
      - name: Retain only the public report and its digest manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ matrix.os }}-${{ matrix.profile }}
          path: |
            .build/ci/report-*/report.json
            .build/ci/report-*/manifest.json
            .build/model/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  handoff:
    name: handoff / ubuntu
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    # The read-only handoff checklist (whitespace, private content, build:check, docs pointers,
    # duration-table coverage, CLAUDE.md/AGENTS.md parity, Git state) ran only locally before
    # batch 5 (open-items D9); a push that passes the gate but fails handoff is now visible remotely.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - name: Run the handoff checklist
        run: npm run --silent wf -- handoff
  release:
    name: release check / ubuntu
    # open-items C12: six tags (v1.1.0 - v1.2.2) were cut on commits whose remote gate was red and
    # nothing said so. A v* tag now runs the strict release consistency check remotely: the version
    # sources agree, the tag points at this commit, the tree is clean, the artifacts are release
    # eligible, and the gate run that main's push started for this commit is green. `--require-main`
    # and `--require-remote` are local-checkout questions (a tag checkout has no branch); the job
    # proves the remote side of them instead: the tagged commit is on origin/main.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Release consistency, with a green remote gate for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npx tsc -b tooling/tsconfig.json --pretty false
          node .build/tooling/release/check-release-consistency.js --require-clean --require-tag --require-remote-gate
