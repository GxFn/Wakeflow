<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>图谱渲染核验</title><style>body{font-family:Arial,"PingFang SC",sans-serif;background:#fff;color:#172238}section{width:1400px;padding:16px;border:1px solid #ddd;margin:12px}svg{max-width:none!important}</style></head><body><pre id="report">正在渲染</pre><main aria-hidden="true"></main><script type="module">
import mermaid from 'mermaid';
const modules=import.meta.glob('../maps/**/*.md',{eager:true,query:'?raw',import:'default'});
mermaid.initialize({startOnLoad:false,securityLevel:'strict',htmlLabels:false,flowchart:{htmlLabels:false,defaultRenderer:'elk',nodeSpacing:40,rankSpacing:60,wrappingWidth:230},sequence:{wrap:true,actorMargin:45,messageMargin:28}});
const results=[];let index=0;
for(const [file,text] of Object.entries(modules).sort(([a],[b])=>a.localeCompare(b))){let ordinal=0;for(const m of text.matchAll(/```mermaid\n([\s\S]*?)```/g)){ordinal++;const sourceDigest='sha256:'+Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(m[1])))).map(x=>x.toString(16).padStart(2,'0')).join('');const title=m[1].match(/accTitle:\s*([^\n]+)/)?.[1]??'';try{await mermaid.parse(m[1]);const rendered=await mermaid.render('verifyGraph'+index++,m[1]);const host=document.createElement('section');host.innerHTML=rendered.svg;document.querySelector('main').append(host);const svg=host.querySelector('svg');const box=svg.viewBox.baseVal;const bounds=svg.getBBox();if(!box.width||!box.height)throw new Error('空 SVG viewBox');results.push({file:file.replace('../',''),diagram:ordinal,title,sourceDigest,status:'pass',width:Math.round(box.width),height:Math.round(box.height),visibleTextNodes:svg.querySelectorAll('text').length,bounds:{x:Math.round(bounds.x),y:Math.round(bounds.y),width:Math.round(bounds.width),height:Math.round(bounds.height)}});}catch(error){results.push({file:file.replace('../',''),diagram:ordinal,title,sourceDigest,status:'fail',error:String(error.message??error).slice(0,500)});}}}
const summary={renderer:'mermaid',rendererVersion:'11.17.2',verifiedAt:new Date().toISOString(),ok:results.length>0&&results.every(x=>x.status==='pass'),diagrams:results.length,rendered:results.filter(x=>x.status==='pass').length,results};
const saved=await fetch('/__atlas-render-receipt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(summary)});summary.receiptSaved=saved.ok;const report=document.getElementById('report');report.textContent=JSON.stringify({ok:summary.ok,diagrams:summary.diagrams,rendered:summary.rendered,receiptSaved:summary.receiptSaved,failures:results.filter(x=>x.status!=='pass')});report.dataset.report=btoa(unescape(encodeURIComponent(JSON.stringify(summary))));report.dataset.status='complete';document.title=summary.ok?'图谱核验通过':'图谱核验失败';
</script></body></html>
